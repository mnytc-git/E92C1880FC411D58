name: Audit Username Maigret

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string

      username:
        description: "Username yang diperiksa"
        required: true
        type: string

      scope:
        description: "Cakupan pemeriksaan"
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "250"
          - "500"
          - "1000"
          - "all"

      category:
        description: "Kategori situs"
        required: true
        default: "social"
        type: choice
        options:
          - social
          - coding
          - business
          - gaming
          - photo
          - global

permissions:
  contents: read

concurrency:
  group: maigret-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: Jalankan pemeriksaan username
    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      JOB_ID: ${{ inputs.job_id }}
      USERNAME_INPUT: ${{ inputs.username }}
      SCOPE_INPUT: ${{ inputs.scope }}
      CATEGORY_INPUT: ${{ inputs.category }}

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: >-
            maigret-audit/requirements.txt

      - name: Instal dependensi
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            -r maigret-audit/requirements.txt

      - name: Periksa sintaks Python
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            maigret-audit/scripts/send_to_apps_script.py

      - name: Tampilkan versi Maigret
        shell: bash
        run: |
          set -euo pipefail

          maigret --version || true

      - name: Validasi masukan
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$JOB_ID" |
            grep -Eq '^[a-fA-F0-9-]{20,50}$'; then
            echo "ID pekerjaan tidak valid."
            exit 1
          fi

          if ! printf '%s' "$USERNAME_INPUT" |
            grep -Eq '^[A-Za-z0-9._-]{2,50}$'; then
            echo "Username tidak valid."
            exit 1
          fi

          case "$SCOPE_INPUT" in
            50|100|250|500|1000|all)
              ;;
            *)
              echo "Cakupan tidak valid."
              exit 1
              ;;
          esac

          case "$CATEGORY_INPUT" in
            social|coding|business|gaming|photo|global)
              ;;
            *)
              echo "Kategori tidak valid."
              exit 1
              ;;
          esac

      - name: Siapkan folder laporan
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "reports/$JOB_ID"

          mkdir -p "reports/$JOB_ID"

      - name: Jalankan Maigret
        shell: bash
        run: |
          set -euo pipefail

          COMMAND=(
            maigret
            "$USERNAME_INPUT"
            --no-recursion
            --timeout 30
            --retries 2
            --max-connections 20
            --cloudflare-bypass
            --print-errors
            --force-update
            --html
            --json simple
            --csv
            --txt
            --folderoutput "reports/$JOB_ID"
          )

          if [ "$SCOPE_INPUT" = "all" ]; then
            COMMAND+=(
              --all-sites
            )

            echo "Mode maksimal: seluruh situs aktif."
          else
            COMMAND+=(
              --top-sites "$SCOPE_INPUT"
            )

            echo "Mode cakupan: top $SCOPE_INPUT situs."
          fi

          if [ "$CATEGORY_INPUT" != "global" ]; then
            COMMAND+=(
              --tags "$CATEGORY_INPUT"
            )

            echo "Filter kategori: $CATEGORY_INPUT."
          else
            echo "Kategori global: tanpa filter tag."
          fi

          printf 'Memulai pemeriksaan username.\n'

          printf 'Cakupan: %s\n' \
            "$SCOPE_INPUT"

          printf 'Kategori: %s\n' \
            "$CATEGORY_INPUT"

          "${COMMAND[@]}"

      - name: Periksa laporan
        shell: bash
        run: |
          set -euo pipefail

          echo "Berkas yang dihasilkan:"

          find "reports/$JOB_ID" \
            -maxdepth 1 \
            -type f \
            -printf '%f | %s byte\n' |
            sort

          FILE_COUNT="$(
            find "reports/$JOB_ID" \
              -maxdepth 1 \
              -type f |
              wc -l
          )"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "Tidak ada laporan yang dihasilkan."
            exit 1
          fi

          echo "Jumlah berkas: $FILE_COUNT"

      - name: Buat metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          job_id = os.environ["JOB_ID"]
          folder = Path("reports") / job_id

          generated_files = sorted(
              path.name
              for path in folder.iterdir()
              if path.is_file()
          )

          metadata = {
              "jobId": job_id,
              "username": os.environ["USERNAME_INPUT"],
              "scope": os.environ["SCOPE_INPUT"],
              "category": os.environ["CATEGORY_INPUT"],
              "status": "completed",
              "createdAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY",
                  "",
              ),
              "runId": os.environ.get(
                  "GITHUB_RUN_ID",
                  "",
              ),
              "runAttempt": os.environ.get(
                  "GITHUB_RUN_ATTEMPT",
                  "",
              ),
              "fileCountBeforeMetadata": len(
                  generated_files
              ),
              "generatedFiles": generated_files,
              "warning": (
                  "Kesamaan username tidak membuktikan "
                  "bahwa seluruh akun dimiliki oleh "
                  "identitas yang sama."
              ),
          }

          output = folder / "metadata.json"

          output.write_text(
              json.dumps(
                  metadata,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

      - name: Buat checksum
        shell: bash
        run: |
          set -euo pipefail

          find "reports/$JOB_ID" \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > "reports/$JOB_ID/SHA256SUMS.txt"

      - name: Kirim laporan
        env:
          APPS_SCRIPT_WEBHOOK_URL: >-
            ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          CALLBACK_SECRET: >-
            ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          python \
            maigret-audit/scripts/send_to_apps_script.py \
            "reports/$JOB_ID"

      - name: Simpan artefak cadangan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maigret-${{ inputs.job_id }}
          path: reports/${{ inputs.job_id }}/
          retention-days: 7
          if-no-files-found: warn